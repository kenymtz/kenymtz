<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" width="800" height="620" font-family="'Courier New', Courier, monospace">
  <style>
    .t { fill: #4dff7a; font-size: 16px; }
    .d { fill: #22b24c; font-size: 16px; }
    .h { fill: #c4ffd3; font-size: 22px; font-weight: bold; }
    .cur { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .flick { animation: flick 6s infinite; }
    @keyframes flick { 0%,96%,100% { opacity: 1; } 97% { opacity: .86; } 98% { opacity: 1; } 99% { opacity: .92; } }
  </style>
  <defs>
    <linearGradient id="bezel" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#f1e9d4"/>
      <stop offset="0.55" stop-color="#ddd2b5"/>
      <stop offset="1" stop-color="#c2b591"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9cfb2"/>
      <stop offset="1" stop-color="#ebe2c9"/>
    </linearGradient>
    <linearGradient id="recess" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f8466"/>
      <stop offset="0.5" stop-color="#b3a786"/>
      <stop offset="1" stop-color="#d6cbac"/>
    </linearGradient>
    <linearGradient id="case" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ebe2c8"/>
      <stop offset="1" stop-color="#c7ba98"/>
    </linearGradient>
    <linearGradient id="caseTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d2c7a8"/>
      <stop offset="1" stop-color="#e6dcc1"/>
    </linearGradient>
    <linearGradient id="neck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a99d7d"/>
      <stop offset="1" stop-color="#d0c4a3"/>
    </linearGradient>
    <radialGradient id="tube" cx="50%" cy="48%" r="62%">
      <stop offset="0" stop-color="#0e3319"/>
      <stop offset="0.7" stop-color="#06180b"/>
      <stop offset="1" stop-color="#010502"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0.6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.75"/>
    </radialGradient>
    <linearGradient id="glare" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.16"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1.2" fill="#000" opacity="0.35"/>
    </pattern>
    <filter id="glow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="soft" x="-5%" y="-50%" width="110%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <clipPath id="screenClip">
      <rect x="160" y="62" width="480" height="318" rx="34"/>
    </clipPath>
  </defs>

  <ellipse cx="400" cy="600" rx="340" ry="14" fill="#000" opacity="0.18" filter="url(#soft)"/>

  <!-- gabinete -->
  <g filter="url(#shadow)">
    <path d="M78 478 L722 478 L706 462 L94 462 Z" fill="url(#caseTop)"/>
    <rect x="78" y="478" width="644" height="118" rx="6" fill="url(#case)" stroke="#a89b78" stroke-width="1.5"/>
  </g>
  <line x1="84" y1="481" x2="716" y2="481" stroke="#fffaf0" stroke-opacity="0.7" stroke-width="1.5"/>
  <rect x="440" y="500" width="248" height="56" rx="4" fill="#d9ceb0" stroke="#a69977"/>
  <rect x="456" y="522" width="216" height="9" rx="3" fill="#2b2720"/>
  <rect x="540" y="537" width="48" height="10" rx="2" fill="#bdb090" stroke="#9c8f6d"/>
  <circle cx="676" cy="512" r="3" fill="#6b6150"/>
  <rect x="104" y="500" width="130" height="26" rx="3" fill="#cfc4a5" stroke="#a69977"/>
  <text x="169" y="518" text-anchor="middle" font-size="12" font-weight="bold" fill="#5e5644" letter-spacing="2">KENYMTZ</text>
  <rect x="270" y="506" width="22" height="8" rx="2" fill="#2fd85a"/>
  <rect x="270" y="506" width="22" height="8" rx="2" fill="#2fd85a" opacity="0.5" filter="url(#glow)"/>
  <rect x="302" y="506" width="22" height="8" rx="2" fill="#7a5b28"/>
  <text x="281" y="526" text-anchor="middle" font-size="7" fill="#7a705a">POWER</text>
  <text x="313" y="526" text-anchor="middle" font-size="7" fill="#7a705a">HDD</text>
  <rect x="352" y="502" width="40" height="22" rx="3" fill="#c9bd9d" stroke="#998c6a"/>
  <rect x="356" y="506" width="32" height="14" rx="2" fill="#ddd2b4"/>
  <g stroke="#a99c7a" stroke-width="2" stroke-linecap="round">
    <line x1="110" y1="546" x2="410" y2="546"/><line x1="110" y1="556" x2="410" y2="556"/>
    <line x1="110" y1="566" x2="410" y2="566"/><line x1="110" y1="576" x2="410" y2="576"/>
  </g>

  <!-- base -->
  <ellipse cx="400" cy="462" rx="150" ry="10" fill="#000" opacity="0.18"/>
  <path d="M300 440 L500 440 L540 462 L260 462 Z" fill="url(#neck)" stroke="#9a8d6b"/>

  <!-- monitor -->
  <g filter="url(#shadow)">
    <path d="M130 22 L670 22 L650 6 L150 6 Z" fill="url(#top)" stroke="#b0a382" stroke-width="1"/>
    <rect x="110" y="20" width="580" height="424" rx="22" fill="url(#bezel)" stroke="#a89b78" stroke-width="2"/>
  </g>
  <path d="M132 23 L668 23" stroke="#fffaf0" stroke-opacity="0.8" stroke-width="2" stroke-linecap="round"/>
  <rect x="140" y="42" width="520" height="358" rx="40" fill="url(#recess)"/>
  <rect x="150" y="52" width="500" height="338" rx="38" fill="#2a271f"/>

  <!-- pantalla -->
  <g clip-path="url(#screenClip)">
    <rect x="160" y="62" width="480" height="318" fill="url(#tube)"/>
    <g filter="url(#glow)" class="flick">
      <text x="190" y="102" class="d">C:\USUARIOS\AUGUSTO&gt; type presentacion.txt</text>
      <text x="190" y="145" class="h">Hola, soy Augusto</text>
      <text x="190" y="185" class="t">Estudiante en UTEC, Uruguay.</text>
      <text x="190" y="208" class="t">Licenciatura en Ingeniería de Datos e IA.</text>
      <text x="190" y="250" class="t">Integrante del equipo de robótica Urubots</text>
      <text x="190" y="273" class="d">https://urubots.uy/</text>
      <text x="190" y="345" class="t">TS · Python · PostgreSQL/PostGIS · Docker<tspan class="cur"> █</tspan></text>
    </g>
    <rect x="160" y="62" width="480" height="318" fill="url(#scan)"/>
    <rect x="160" y="62" width="480" height="318" fill="url(#vignette)"/>
    <path d="M178 76 Q400 58 622 76 Q560 120 420 132 Q260 140 178 176 Z" fill="url(#glare)"/>
  </g>
  <rect x="160" y="62" width="480" height="318" rx="34" fill="none" stroke="#000" stroke-opacity="0.6" stroke-width="3"/>

  <text x="150" y="425" font-size="13" font-weight="bold" fill="#8a7f62" letter-spacing="3">KENYMTZ</text>
  <text x="252" y="425" font-size="10" fill="#9b9073" letter-spacing="1">MONOCHROME DISPLAY</text>
  <g stroke="#b5a885" stroke-width="2.5" stroke-linecap="round">
    <line x1="440" y1="414" x2="440" y2="430"/><line x1="450" y1="414" x2="450" y2="430"/>
    <line x1="460" y1="414" x2="460" y2="430"/><line x1="470" y1="414" x2="470" y2="430"/>
    <line x1="480" y1="414" x2="480" y2="430"/><line x1="490" y1="414" x2="490" y2="430"/>
  </g>
  <circle cx="540" cy="422" r="8" fill="#cbbf9f" stroke="#998c6a"/>
  <circle cx="566" cy="422" r="8" fill="#cbbf9f" stroke="#998c6a"/>
  <rect x="598" y="412" width="44" height="20" rx="4" fill="#c9bd9d" stroke="#998c6a"/>
  <circle cx="658" cy="422" r="4" fill="#38e866"/>
  <circle cx="658" cy="422" r="5" fill="#38e866" opacity="0.6" filter="url(#glow)"/>
</svg>
