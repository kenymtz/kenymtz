<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" width="800" height="640" font-family="'Courier New', Courier, monospace">
  <style>
    .t { fill: #33ff66; font-size: 17px; }
    .d { fill: #1fa848; font-size: 17px; }
    .h { fill: #b6ffcb; font-size: 22px; font-weight: bold; }
    .cur { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .line { opacity: 0; animation: show 0.01s forwards; }
  </style>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0b2a14"/>
      <stop offset="100%" stop-color="#030a05"/>
    </radialGradient>
    <linearGradient id="beige" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ece3cc"/>
      <stop offset="100%" stop-color="#cfc3a4"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity="0.18"/>
    </pattern>
    <g id="row">
      <rect x="0" y="0" width="30" height="16" rx="3"/><rect x="36" y="0" width="30" height="16" rx="3"/>
      <rect x="72" y="0" width="30" height="16" rx="3"/><rect x="108" y="0" width="30" height="16" rx="3"/>
      <rect x="144" y="0" width="30" height="16" rx="3"/><rect x="180" y="0" width="30" height="16" rx="3"/>
      <rect x="216" y="0" width="30" height="16" rx="3"/><rect x="252" y="0" width="30" height="16" rx="3"/>
      <rect x="288" y="0" width="30" height="16" rx="3"/><rect x="324" y="0" width="30" height="16" rx="3"/>
      <rect x="360" y="0" width="30" height="16" rx="3"/><rect x="396" y="0" width="30" height="16" rx="3"/>
      <rect x="432" y="0" width="30" height="16" rx="3"/><rect x="468" y="0" width="30" height="16" rx="3"/>
    </g>
  </defs>

  <!-- monitor -->
  <rect x="60" y="10" width="680" height="470" rx="26" fill="url(#beige)" stroke="#a89c7e" stroke-width="3"/>
  <rect x="95" y="40" width="610" height="380" rx="18" fill="#8a8068"/>
  <rect x="110" y="55" width="580" height="350" rx="30" fill="url(#glow)"/>
  <rect x="110" y="55" width="580" height="350" rx="30" fill="url(#scan)"/>

  <!-- screen text -->
  <text x="140" y="95" class="d">C:\USUARIOS\AUGUSTO&gt; type presentacion.txt</text>
  <text x="140" y="135" class="h">Hola, soy Augusto</text>
  <text x="140" y="170" class="t">Estudiante en UTEC, Uruguay.</text>
  <text x="140" y="195" class="t">Agarro datos públicos y los convierto</text>
  <text x="140" y="220" class="t">en algo que a la gente le sirva.</text>
  <text x="140" y="260" class="d">&gt; proyecto actual</text>
  <text x="140" y="285" class="t">canasta-uy: dónde conviene hacer las</text>
  <text x="140" y="310" class="t">compras en tu ciudad (datos del SIPC).</text>
  <text x="140" y="350" class="d">&gt; stack</text>
  <text x="140" y="375" class="t">TS · Python · PostgreSQL/PostGIS · Docker</text>
  <rect x="600" y="362" width="11" height="17" fill="#33ff66" class="cur"/>

  <!-- brand + led -->
  <text x="110" y="458" fill="#8a7f63" font-size="14" font-weight="bold">KENYMTZ PC</text>
  <circle cx="680" cy="453" r="6" fill="#3ddc64"/>
  <rect x="610" y="447" width="50" height="12" rx="3" fill="#bfb293"/>

  <!-- stand -->
  <path d="M330 480 L470 480 L500 515 L300 515 Z" fill="#c9bd9c" stroke="#a89c7e" stroke-width="2"/>

  <!-- keyboard -->
  <path d="M110 540 L690 540 L730 625 L70 625 Z" fill="url(#beige)" stroke="#a89c7e" stroke-width="3"/>
  <g fill="#ddd3b8" stroke="#a89c7e" stroke-width="1">
    <use href="#row" x="151" y="552"/>
    <use href="#row" x="151" y="576"/>
  </g>
  <rect x="260" y="600" width="280" height="14" rx="3" fill="#ddd3b8" stroke="#a89c7e"/>
</svg>
